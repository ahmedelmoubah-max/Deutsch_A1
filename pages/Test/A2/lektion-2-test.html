<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#2457d6">
<title>Gut aussehen – Kleidung | Interaktive Übungen</title>
<style>
:root{
  --ink:#172554;--muted:#64748b;--paper:#f7f9ff;--line:#e5eaf5;
  --blue:#2878e8;--purple:#8154d9;--pink:#e94d91;--green:#16a477;
  --orange:#f08a25;--yellow:#f3c64e;--red:#e35b62;
  --shadow:0 12px 35px rgba(29,54,112,.09);--radius:24px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:linear-gradient(180deg,#eaf3ff 0,#f8faff 330px,#f6f8fc 100%);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.55}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.91);backdrop-filter:blur(14px);border-bottom:1px solid #e5ebf5}
.topbar-inner{max-width:1440px;margin:auto;padding:10px 22px;display:flex;align-items:center;gap:16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:900;white-space:nowrap}
.brand-mark{width:38px;height:38px;border-radius:13px;background:linear-gradient(135deg,#1e75ed,#8b55dc);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 7px 16px #4b75d83d}
.top-progress{flex:1;min-width:90px}
.progress-meta{display:flex;justify-content:space-between;font-size:12px;color:#64748b;font-weight:700;margin-bottom:5px}
.progress-track{height:8px;background:#e8edf7;border-radius:20px;overflow:hidden}
.progress-fill{height:100%;width:0;background:linear-gradient(90deg,#2878e8,#a24fdb,#ed5593);border-radius:20px;transition:width .35s}
.stat-pill{border:1px solid #e4eaf4;background:#fff;padding:8px 12px;border-radius:14px;font-weight:800;font-size:13px;white-space:nowrap}
.reset-all{border:0;background:#fff1f2;color:#c24152;border-radius:12px;padding:9px 12px;font-weight:800}
.hero{max-width:1440px;margin:22px auto 18px;padding:0 22px}
.hero-card{position:relative;overflow:hidden;border-radius:30px;background:linear-gradient(115deg,#173e91 0%,#276fca 48%,#7d52d5 100%);color:#fff;padding:30px 34px;box-shadow:0 18px 45px #244e9c2b}
.hero-card:before,.hero-card:after{content:"";position:absolute;border-radius:50%;background:#ffffff12}
.hero-card:before{width:300px;height:300px;right:10%;top:-180px}
.hero-card:after{width:220px;height:220px;right:-40px;bottom:-150px}
.hero-content{position:relative;z-index:1;max-width:820px}
.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#ffffff22;border:1px solid #ffffff35;padding:6px 12px;border-radius:30px;font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.hero h1{font-size:clamp(29px,4vw,48px);line-height:1.08;margin:13px 0 8px;letter-spacing:-.04em}
.hero p{margin:0;color:#e7efff;max-width:670px;font-size:15px}
.hero-bottom{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.hero-chip{background:#ffffff1c;border:1px solid #ffffff30;padding:7px 11px;border-radius:12px;font-size:12px;font-weight:750}
.layout{max-width:1440px;margin:auto;padding:0 22px 60px;display:grid;grid-template-columns:330px minmax(0,1fr);gap:20px;align-items:start}
.sidebar{position:sticky;top:82px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:15px;box-shadow:var(--shadow);max-height:calc(100vh - 100px);overflow:auto}
.side-title{font-size:11px;color:#94a3b8;font-weight:900;letter-spacing:.12em;text-transform:uppercase;padding:5px 9px 10px}
.nav-link{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:12px;color:#52627d;font-size:13px;font-weight:750;margin:2px 0;transition:.2s}
.nav-link:hover{background:#f2f6ff;color:#2457d6}
.nav-num{width:25px;height:25px;display:grid;place-items:center;border-radius:8px;background:#eef3fb;color:#49628c;font-size:11px;font-weight:900;flex:none}
.nav-link.done .nav-num{background:#dcfce9;color:#168458}
.main{min-width:0}
.section-heading{display:flex;align-items:end;justify-content:space-between;gap:12px;margin:5px 2px 14px}
.section-heading h2{font-size:22px;margin:0;letter-spacing:-.03em}
.section-heading p{margin:3px 0 0;color:var(--muted);font-size:13px}
.poster-card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;box-shadow:var(--shadow);margin-bottom:18px}
.poster-card summary{cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;font-weight:850}
.poster-card summary span:first-child{display:flex;align-items:center;gap:10px}
.poster-card summary .tag{font-size:11px;background:#edf4ff;color:#2b65c4;border-radius:20px;padding:5px 9px}
.poster-wrap{padding-top:14px;text-align:center}
.poster-wrap img{max-width:100%;max-height:650px;object-fit:contain;border-radius:15px;border:1px solid #edf0f7}
.exercise{position:relative;background:#fff;border:1px solid var(--line);border-radius:26px;padding:22px;margin:0 0 19px;box-shadow:var(--shadow);scroll-margin-top:88px;overflow:hidden}
.exercise:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent,var(--blue))}
.exercise-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:16px}
.exercise-title-wrap{display:flex;gap:12px;align-items:center;min-width:0}
.exercise-icon{width:44px;height:44px;border-radius:15px;display:grid;place-items:center;background:var(--soft,#edf4ff);font-size:22px;flex:none}
.exercise h3{margin:0;font-size:19px;letter-spacing:-.025em}
.exercise-sub{font-size:12px;color:var(--muted);margin-top:3px}
.exercise-num{border:1px solid var(--line);background:#f8faff;color:#64748b;padding:6px 10px;border-radius:11px;font-size:11px;font-weight:900;white-space:nowrap}
.instruction{padding:10px 13px;border-radius:13px;background:var(--soft,#f1f6ff);color:#40516f;font-size:13px;font-weight:700;margin:0 0 15px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.q-item{border:1px solid #e7ecf5;border-radius:15px;padding:12px;background:#fff;min-width:0;transition:.18s}
.q-item.correct{border-color:#7bd6ad;background:#f0fff7}
.q-item.incorrect{border-color:#f2a3a3;background:#fff5f5}
.q-label{font-weight:800;font-size:14px;margin-bottom:8px}
.small-ar{font-family:Tahoma,Arial,sans-serif;direction:rtl;unicode-bidi:plaintext;color:#64748b;font-size:13px}
.option-row{display:flex;flex-wrap:wrap;gap:7px}
.choice{border:1px solid #dfe6f2;background:#fff;border-radius:11px;padding:7px 11px;color:#40516f;font-weight:750;font-size:13px;transition:.15s}
.choice:hover{border-color:var(--accent,var(--blue));background:var(--soft,#f3f7ff)}
.choice.selected{background:var(--accent,var(--blue));border-color:var(--accent,var(--blue));color:#fff}
.choice:disabled{opacity:.6;cursor:default}
.field,select.field,textarea.field{width:100%;border:1px solid #dce4f0;border-radius:11px;padding:10px 11px;background:#fff;color:#1e293b;outline:none;min-width:0}
.field:focus{border-color:var(--accent,var(--blue));box-shadow:0 0 0 3px color-mix(in srgb,var(--accent,var(--blue)) 15%,transparent)}
.field[dir=rtl]{text-align:right}
.field-wrap{display:grid;gap:7px}
.field-label{font-size:12px;font-weight:800;color:#52627d}
.btn-row{display:flex;align-items:center;flex-wrap:wrap;gap:9px;margin-top:16px}
.primary-btn{border:0;background:var(--accent,var(--blue));color:#fff;padding:10px 16px;border-radius:12px;font-weight:850;box-shadow:0 5px 12px color-mix(in srgb,var(--accent,var(--blue)) 22%,transparent)}
.secondary-btn{border:1px solid #dfe6f1;background:#fff;color:#53627a;padding:9px 13px;border-radius:12px;font-weight:800}
.next-btn{border:0;background:#edf4ff;color:#255fc2;padding:10px 14px;border-radius:12px;font-weight:850}
.feedback{display:none;margin-top:13px;border-radius:13px;padding:11px 13px;font-size:13px;font-weight:800}
.feedback.show{display:block}
.feedback.good{background:#e9fff3;color:#16734d}
.feedback.mid{background:#fff7e6;color:#9a5a08}
.feedback.bad{background:#fff0f0;color:#b23b45}
.muted{color:var(--muted)}
/* unique exercise themes */
.theme-blue{--accent:#2681e8;--soft:#edf6ff}
.theme-gold{--accent:#e2a51e;--soft:#fff8df}
.theme-purple{--accent:#8a55dc;--soft:#f4efff}
.theme-mint{--accent:#16a477;--soft:#eafaf4}
.theme-coral{--accent:#e66c54;--soft:#fff1eb}
.theme-navy{--accent:#334b86;--soft:#edf1fb}
.theme-map{--accent:#18a68a;--soft:#e8fbf5;background:linear-gradient(135deg,#fff 0%,#f4fffb 100%)}
.theme-orange{--accent:#ed8b2b;--soft:#fff3e5}
.theme-pink{--accent:#e64e91;--soft:#fff0f7}
.theme-audio{--accent:#6559d7;--soft:#f0efff}
.theme-reading{--accent:#b68a43;--soft:#fff9ec}
.theme-chat{--accent:#2497b9;--soft:#eaf9ff}
.theme-detective{--accent:#df555c;--soft:#fff0f0}
.theme-sort{--accent:#5471b8;--soft:#eef3ff}
.theme-write{--accent:#2d8c74;--soft:#edfaf5}
.theme-final{--accent:#263b77;--soft:#eaf0ff;background:linear-gradient(145deg,#fff 0%,#f3f6ff 100%)}
.match-columns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.match-col{display:grid;gap:8px}
.match-btn{width:100%;min-height:43px;text-align:left;border:1px solid #e1e8f3;background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;color:#354663;display:flex;justify-content:space-between;align-items:center;gap:8px}
.match-btn .small-ar{font-size:13px}
.match-btn.active{outline:2px solid var(--accent);background:var(--soft)}
.match-btn.matched{background:#eafff3;border-color:#77d6a8;color:#18734e;opacity:.78}
.match-btn.wrong{border-color:#ed9a9a;background:#fff1f1}
.pair-counter{font-size:12px;font-weight:850;color:var(--muted);margin:0 0 10px}
.article-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.article-card{border-radius:16px;padding:12px;border:1px solid #f0e5bc;background:#fffdf6}
.article-word{font-size:17px;font-weight:900;margin-bottom:9px}
.article-word small{display:block;color:#8b7b50;font-size:11px;font-weight:650;margin-top:2px}
.article-buttons{display:flex;gap:5px}
.article-buttons .choice{flex:1;padding:7px 3px}
.word-puzzle{background:#fff;border:1px dashed #efb09b;border-radius:14px;padding:12px}
.scramble{font-size:19px;font-weight:950;letter-spacing:.15em;color:#d05c47}
.sentence-box{background:#172c5b;color:#fff;padding:16px;border-radius:17px;margin-bottom:12px}
.sentence-box .q-label{color:#e7edff}
.word-bank{display:flex;flex-wrap:wrap;gap:7px}
.word-chip{border:1px solid #ccd7ef;background:#fff;border-radius:10px;padding:7px 10px;font-weight:800;color:#30446f}
.word-chip.used{opacity:.35;text-decoration:line-through}
.answer-line{min-height:44px;background:#ffffff16;border:1px dashed #ffffff66;border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin-top:11px}
.answer-chip{background:#dce8ff;color:#1d3974;padding:5px 9px;border-radius:8px;font-size:13px;font-weight:850}
.map-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.map-tile{border-radius:16px;background:#fff;border:1px solid #cdeee2;padding:13px;text-align:center}
.map-emoji{font-size:27px}
.map-tile select{margin-top:8px}
.adj-match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.adj-side{display:grid;gap:8px}
.adj-card{border-radius:14px;padding:12px;border:1px solid #f3c5d9;background:#fff;font-weight:900;text-align:center}
.sound-row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid #e1ddff;border-radius:15px;padding:12px}
.sound-btn{width:44px;height:44px;border:0;border-radius:14px;background:#6559d7;color:#fff;font-size:20px;flex:none}
.reading-paper{background:#fffdf7;border:1px solid #f1e2bf;border-radius:17px;padding:18px 20px;font-family:Georgia,serif;color:#594a30;font-size:16px;line-height:1.85;box-shadow:inset 0 0 0 5px #fff9eb}
.chat-line{display:flex;gap:10px;align-items:flex-start;margin:11px 0}
.avatar{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#dff5ff;flex:none}
.bubble{background:#fff;border:1px solid #d6edf6;border-radius:4px 16px 16px 16px;padding:11px 13px;max-width:88%;font-weight:700}
.chat-line.right{flex-direction:row-reverse}
.chat-line.right .bubble{background:#eafaf3;border-color:#d3f0e2;border-radius:16px 4px 16px 16px}
.lined{background:repeating-linear-gradient(#fff,#fff 31px,#dce8e2 32px);line-height:32px;min-height:150px}
.wordbank{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0}
.wordbank span{background:#e8f5ef;color:#26725c;border-radius:9px;padding:6px 9px;font-size:12px;font-weight:850}
.final-banner{background:#20396f;color:#fff;border-radius:17px;padding:17px;margin-bottom:14px}
.final-banner strong{font-size:18px}
.footer{text-align:center;color:#94a3b8;font-size:12px;padding:15px}
@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar{position:relative;top:auto;max-height:none;display:flex;gap:5px;overflow-x:auto;padding:10px}.side-title{display:none}.nav-link{flex:none;white-space:nowrap}.nav-num{width:23px;height:23px}.hero{margin-top:14px}.hero-card{padding:24px}}
@media(max-width:650px){
 .topbar-inner{padding:8px 12px;gap:8px}.brand{font-size:12px}.brand-mark{width:32px;height:32px}.stat-pill{font-size:11px;padding:7px 8px}.reset-all{font-size:11px;padding:8px}.progress-meta{font-size:10px}
 .hero{padding:0 12px}.hero-card{padding:22px 19px;border-radius:22px}.hero p{font-size:13px}
 .layout{padding:0 12px 40px;gap:12px}.sidebar{border-radius:16px}.exercise{padding:16px;border-radius:20px}.exercise h3{font-size:17px}.exercise-icon{width:39px;height:39px}
 .grid-2,.match-columns{grid-template-columns:1fr}.grid-3,.article-grid,.map-grid{grid-template-columns:repeat(2,1fr)}
 .adj-match{gap:7px}.match-btn{font-size:12px}.exercise-num{font-size:10px;padding:5px 7px}
 .section-heading h2{font-size:19px}
}
@media(max-width:390px){.grid-3,.article-grid,.map-grid{grid-template-columns:1fr}.stat-pill.points{display:none}.exercise-head{gap:6px}}

/* Duolingo-like roadmap sidebar */
.duolingo-sidebar{
  background:linear-gradient(180deg,#fbfdff 0%,#f4f8ff 100%);
  border:1px solid #e4ebf8;
  border-radius:28px;
  padding:16px;
  box-shadow:0 18px 40px rgba(30,64,175,.08);
}
.duo-header-card{
  background:linear-gradient(135deg,#1d4ed8 0%,#2563eb 50%,#7c3aed 100%);
  color:#fff;
  border-radius:24px;
  padding:16px;
  margin-bottom:16px;
  box-shadow:0 16px 30px rgba(37,99,235,.25);
}
.duo-mini-label{
  display:inline-block;
  font-size:11px;
  font-weight:900;
  letter-spacing:.12em;
  text-transform:uppercase;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(255,255,255,.18);
  border:1px solid rgba(255,255,255,.22);
}
.duo-percentage-wrap{
  display:flex;
  gap:14px;
  align-items:center;
  margin-top:12px;
}
.duo-ring{
  width:94px;height:94px;flex:none;border-radius:50%;
  background:conic-gradient(#facc15 0 360deg,#ffffff26 360deg 360deg);
  display:grid;place-items:center;
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.12);
}
.duo-ring-inner{
  width:72px;height:72px;border-radius:50%;background:#fff;color:#1e3a8a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  font-weight:900;
}
.duo-ring-inner span{font-size:18px;line-height:1}
.duo-ring-inner small{font-size:10px;color:#64748b;margin-top:3px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
.duo-head-meta h3{margin:0 0 5px;font-size:20px;letter-spacing:-.03em}
.duo-head-meta p{margin:0;color:#e5edff;font-size:12px;line-height:1.5}
.duo-progress-line{
  height:10px;border-radius:999px;background:rgba(255,255,255,.22);
  margin-top:14px;overflow:hidden;border:1px solid rgba(255,255,255,.18)
}
.duo-progress-fill{
  height:100%;width:0%;
  background:linear-gradient(90deg,#facc15,#fde68a);
  border-radius:999px;
  transition:width .35s ease;
}
.duo-progress-caption{
  display:flex;justify-content:space-between;gap:10px;
  font-size:11px;font-weight:800;margin-top:8px;color:#eef4ff
}
.duo-stage{
  position:relative;
  background:#fff;
  border:1px solid #e6edf8;
  border-radius:24px;
  padding:16px 14px 14px;
  margin:0 0 14px;
  box-shadow:0 10px 24px rgba(51,84,160,.07);
}
.duo-stage:before{
  content:"";
  position:absolute;left:26px;top:-14px;width:2px;height:14px;
  background:linear-gradient(180deg,#bed6ff,#dbeafe);
}
.duo-stage:first-of-type:before{display:none}
.duo-stage-top{
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  margin-bottom:12px;
}
.duo-stage-kicker{
  color:#7c8aa5;font-size:11px;font-weight:900;letter-spacing:.12em;text-transform:uppercase;
}
.duo-stage-title{
  color:#1f3b73;font-size:18px;font-weight:900;letter-spacing:-.02em;margin-top:3px;
}
.duo-stars{
  font-size:14px;
  background:#fff8db;
  border:1px solid #fde68a;
  color:#c48a00;
  border-radius:999px;
  padding:6px 10px;
  white-space:nowrap;
  box-shadow:inset 0 -2px 0 rgba(250,204,21,.18);
}
.duo-stage-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}
.duo-stage-grid.trio .duo-node:last-child{
  grid-column:1 / -1;
}
.duo-node{
  display:flex;align-items:center;gap:10px;
  min-height:62px;
  border-radius:18px;
  padding:10px 12px;
  background:linear-gradient(180deg,#f8fbff 0%,#eef5ff 100%);
  border:1px solid #dce9fb;
  color:#40516f;
  font-weight:850;
  transition:.18s ease;
  box-shadow:0 6px 14px rgba(59,130,246,.07);
}
.duo-node:hover{
  transform:translateY(-2px);
  border-color:#93c5fd;
  background:linear-gradient(180deg,#ffffff 0%,#eff6ff 100%);
  color:#1d4ed8;
}
.duo-node-num{
  width:34px;height:34px;flex:none;border-radius:12px;
  display:grid;place-items:center;
  background:linear-gradient(180deg,#2563eb 0%,#1d4ed8 100%);
  color:#fff;font-size:13px;font-weight:900;
  box-shadow:0 5px 10px rgba(37,99,235,.24);
}
.duo-node-label{
  font-size:13px;line-height:1.2;
}
.duo-node.done{
  background:linear-gradient(180deg,#effdf6 0%,#dcfce7 100%);
  border-color:#9ae6b4;
  color:#166534;
}
.duo-node.done .duo-node-num{
  background:linear-gradient(180deg,#22c55e 0%,#16a34a 100%);
}
@media(max-width:980px){
  .duolingo-sidebar{padding:14px}
  .duo-stage-grid,.duo-stage-grid.trio{grid-template-columns:1fr}
  .duo-stage-grid.trio .duo-node:last-child{grid-column:auto}
}
@media(max-width:650px){
  .duo-percentage-wrap{flex-direction:column;align-items:flex-start}
  .duo-ring{width:84px;height:84px}
  .duo-ring-inner{width:64px;height:64px}
  .duo-stage-title{font-size:16px}
  .duo-stage-top{flex-direction:column;align-items:flex-start}
  .duo-stars{font-size:13px}
}




/* Stage sidebar + main stage circles + full-page exercise display */
.layout{max-width:1500px;margin:auto;padding:0 22px 60px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px;align-items:start}
.stage-sidebar{
  background:linear-gradient(180deg,#fbfdff 0%,#f3f7ff 100%);
  border:1px solid #e2eaf8;border-radius:26px;padding:15px;box-shadow:0 16px 35px rgba(36,74,144,.09)
}
.duo-header-card{
  border-radius:24px;background:linear-gradient(145deg,#1749a4 0%,#2563eb 58%,#7547d6 100%);
  padding:16px;box-shadow:0 16px 32px rgba(37,99,235,.24)

     <button class="primary-btn" type="button" data-check="${e.id}">${primaryLabel}</button>
     <button class="secondary-btn" type="button" data-reset-exercise="${e.id}">${secondaryLabel}</button>
     ${e.id==="u17"?"":`<button class="next-btn" type="button" data-next="${e.id}">Weiter →</button>`}
   </div>`;
}
function handleVocabMatch(btn){
 const key=String(btn.dataset.key),side=btn.dataset.side;
 if(vocabMatchState.done.has(key))return;
 const section=document.getElementById("u1");
 const fb=document.getElementById("fb-u1");
 if(side==="left"){
   section.querySelectorAll('[data-vocab-match][data-side="left"]').forEach(b=>{
     b.classList.remove("active");b.setAttribute("aria-pressed","false");
   });
   vocabMatchState.left=key;
   btn.classList.add("active");btn.setAttribute("aria-pressed","true");
   const status=document.getElementById("matchProgressStatus1");
   if(status)status.textContent="Wähle jetzt die passende arabische Übersetzung";
   return;
 }
 if(vocabMatchState.left===null){
   if(fb){fb.className="feedback show mid";fb.textContent="اختار الكلمة بالألمانية أولاً.";}
   return;
 }
 if(vocabMatchState.left===key){
   section.querySelectorAll(`[data-vocab-match][data-key="${key}"]`).forEach(b=>{
     b.classList.remove("active");b.classList.add("matched");b.setAttribute("aria-pressed","false");
   });
   vocabMatchState.done.add(key);
   const count=vocabMatchState.done.size,total=exercises.find(e=>e.id==="u1").questions.length;
   const countEl=document.getElementById("matchCount1");
   const status=document.getElementById("matchProgressStatus1");
   const fill=document.getElementById("matchProgressFill1");
   const track=section.querySelector(".match-progress-track");
   if(countEl)countEl.textContent=`${count} / ${total} Paare gefunden`;
   if(status)status.textContent=count===total?"Alle Wortpaare gefunden!":"Sehr gut – noch "+(total-count)+" Paare";
   if(fill)fill.style.width=(count/total*100)+"%";
   if(track)track.setAttribute("aria-valuenow",String(count));
   if(fb){fb.className="feedback show good";fb.textContent="Sehr gut! Das Wortpaar ist richtig.";}
   if(count===total){completed.u1=true;scoreMap.u1=total;updateDashboard();}
 }else{
   btn.classList.add("wrong");
   if(fb){fb.className="feedback show mid";fb.textContent="Das passt noch nicht zusammen. Versuch es erneut.";}
   setTimeout(()=>btn.classList.remove("wrong"),550);
   section.querySelectorAll('[data-vocab-match][data-side="left"]').forEach(b=>b.classList.remove("active"));
 }
 vocabMatchState.left=null;
}
function renderAll(){
 renderStages();
 const host=document.getElementById("exerciseHost");
 exercises.forEach(e=>{
   const section=document.createElement("section");
   section.className=`exercise ${e.theme}`;
   section.id=e.id;
   host.appendChild(section);
   renderExercise(e);
 });
}
function showStage(stageId,scroll=true){
 const home=document.getElementById("stageHome");
 if(home)home.style.display="";
 document.querySelectorAll(".stage-screen").forEach(screen=>{
   screen.classList.toggle("active-stage-screen",screen.dataset.stageScreen===stageId);
 });
 document.querySelectorAll(".stage-item").forEach(item=>{
   item.classList.toggle("is-open",item.dataset.stageItem===stageId);
 });
 document.querySelectorAll(".stage-nav-btn").forEach(btn=>{
   const active=btn.dataset.showStage===stageId;
   btn.classList.toggle("active",active);
   btn.setAttribute("aria-expanded",active?"true":"false");
 });
 document.querySelectorAll(".exercise").forEach(el=>el.classList.remove("active-exercise"));
 currentExercise=null;
 if(scroll){
   const item=document.querySelector('[data-stage-item="'+stageId+'"]');
   if(item)setTimeout(()=>item.scrollIntoView({behavior:"smooth",block:"nearest"}),40);
 }
}
function openExercise(id){
 const e=exercises.find(x=>x.id===id);
 if(!e)return;
 currentExercise=id;
 const home=document.getElementById("stageHome");
 if(home)home.style.display="none";
 document.querySelectorAll(".exercise").forEach(el=>{
   el.classList.toggle("active-exercise",el.id===id);
 });
 document.querySelectorAll(".stage-nav-btn").forEach(btn=>{
   btn.classList.toggle("active",btn.dataset.showStage===e.stage);
 });
 document.querySelectorAll(".lesson-circle").forEach(btn=>{
   btn.classList.toggle("active",btn.dataset.openExercise===id);
 });
 const section=document.getElementById(id);
 if(section)setTimeout(()=>section.scrollIntoView({behavior:"smooth",block:"start"}),40);
}
function normalize(s){
 return String(s||"").trim().toLocaleLowerCase("de-DE").replace(/[.!?،؛,:]/g,"").replace(/\s+/g," ");
}
function checkExercise(id){
 const e=exercises.find(x=>x.id===id);if(!e)return;
 const section=document.getElementById(id);
 const fb=document.getElementById("fb-"+id);
 let correct=0,total=0,missing=0;
 if(id==="u1"){
   total=e.questions.length;
   correct=vocabMatchState.done.size;
   missing=total-correct;
   fb.className="feedback show "+(correct===total?"good":correct>=Math.ceil(total*.65)?"mid":"bad");
   fb.textContent=`Ergebnis: ${correct} / ${total} Wortpaare richtig${missing?` · ${missing} noch offen`:""}. ${correct===total?"Ausgezeichnet!":"Versuche die übrigen Paare zu verbinden."}`;
 }else if(e.type==="writing"){
   const area=document.getElementById("writing-"+id);
   const text=area?area.value.trim():"";
   const sentences=(text.match(/[.!?](?:\s|$)/g)||[]).length;
   const vocab=["mantel","jacke","rock","bluse","jeans","pullover","kleid","hose","schuhe","stiefel","hemd","mütze","anzug","schal"];
   const comparative=["schöner","größer","kleiner","länger","kürzer","teurer","billiger","älter","besser","höher","wärmer","bequemer","mehr","lieber"];
   const lower=normalize(text);
   const vocabCount=vocab.filter(w=>lower.includes(w)).length;
   const hasColor=["rot","blau","gelb","grün","grau","rosa","braun","schwarz","orange","weiß"].some(w=>lower.includes(w));
   const hasComp=comparative.some(w=>lower.includes(w));
   const checks=[sentences>=4,vocabCount>=3,hasColor&&hasComp];
   correct=checks.filter(Boolean).length;total=3;
   fb.className="feedback show "+(correct===3?"good":correct>=2?"mid":"bad");
   fb.innerHTML=`${correct===3?"Sehr gut!":correct>=2?"Fast geschafft!":"Weiter üben!"}<br>✓ ${sentences} جمل مكتوبة (المطلوب 4 على الأقل) · ${vocabCount} كلمات ملابس · ${hasColor?"لون موجود":"خاصك لون"} · ${hasComp?"صيغة مقارنة موجودة":"خاصك صيغة مقارنة"}.<br>التنقيط: ${correct}/3.`;
 }else{
   e.questions.forEach((q,i)=>{
     total++;
     const item=section.querySelector(`[data-question="${i}"]`);
     let val="";
     const select=item?.querySelector("[data-answer-select]");
     const textInput=item?.querySelector("[data-answer-input]");
     const hidden=item?.querySelector("[data-answer-hidden]");
     const radio=item?.querySelector('input[type="radio"]:checked');
     if(select)val=select.value;
     else if(textInput)val=textInput.value;
     else if(hidden)val=hidden.value;
     else if(radio)val=radio.value;
     const accepted=q.answers||[q.a];
     const ok=accepted.some(a=>normalize(a)===normalize(val));
     if(item){
       item.classList.toggle("correct",ok);
       item.classList.toggle("incorrect",!ok);
       const old=item.querySelector(".answer-note");if(old)old.remove();
     }
     if(ok)correct++;else if(!val)missing++;
   });
   fb.className="feedback show "+(correct===total?"good":correct>=Math.ceil(total*.65)?"mid":"bad");
   fb.textContent=`Ergebnis: ${correct} / ${total} richtig${missing?` · ${missing} ohne Antwort`:""}. ${correct===total?"Ausgezeichnet!":correct>=Math.ceil(total*.65)?"Gut gemacht – schau dir die Fehler an.":"Versuch es noch einmal und lerne die Lösungen."}`;
 }
 scoreMap[id]=correct;
 completed[id]=true;
 updateDashboard();
}
function revealExercise(id){
 const e=exercises.find(x=>x.id===id);if(!e)return;
 const section=document.getElementById(id);
 if(id==="u1"){
   vocabMatchState.done=new Set(e.questions.map((q,i)=>String(i)));
   vocabMatchState.left=null;
   section.querySelectorAll("[data-vocab-match]").forEach(btn=>btn.classList.add("matched"));
   const count=e.questions.length;
   const countEl=document.getElementById("matchCount1");
   const status=document.getElementById("matchProgressStatus1");
   const fill=document.getElementById("matchProgressFill1");
   if(countEl)countEl.textContent=`${count} / ${count} Paare gefunden`;
   if(status)status.textContent="Alle Wortpaare angezeigt";
   if(fill)fill.style.width="100%";
 }else if(e.type==="writing"){
   const fb=document.getElementById("fb-"+id);
   fb.className="feedback show mid";
   fb.textContent="Musterlösung: Ich trage gern Jeans und einen Pullover. Im Winter trage ich eine warme Jacke. Meine blaue Jacke ist schöner als mein alter Mantel. Ich finde bequeme Schuhe sehr wichtig.";
   return;
 }else{
   e.questions.forEach((q,i)=>{
     const item=section.querySelector(`[data-question="${i}"]`);
     const ans=q.a||(q.answers&&q.answers[0]);
     const select=item?.querySelector("[data-answer-select]");
     const textInput=item?.querySelector("[data-answer-input]");
     const hidden=item?.querySelector("[data-answer-hidden]");
     if(select)select.value=ans;
     else if(textInput)textInput.value=ans;
     else if(hidden){
       hidden.value=ans;
       item.querySelectorAll(".choice").forEach(btn=>btn.classList.toggle("selected",normalize(btn.dataset.choiceValue)===normalize(ans)));
     }else{
       const radio=[...item.querySelectorAll('input[type="radio"]')].find(input=>normalize(input.value)===normalize(ans));
       if(radio)radio.checked=true;
     }
   });
 }
 const fb=document.getElementById("fb-"+id);
 fb.className="feedback show mid";
 fb.textContent="Die richtigen Antworten wurden angezeigt. Drücke „Prüfen“, um dein Ergebnis zu speichern.";
}
function resetExercise(id){
 const e=exercises.find(x=>x.id===id);if(!e)return;
 delete completed[id];delete scoreMap[id];
 if(id==="u1"){
   vocabMatchState.left=null;
   vocabMatchState.done.clear();
 }
 renderExercise(e);
 updateDashboard();
}
function updateDashboard(){
 stages.forEach(s=>{
   const list=exercises.filter(e=>e.stage===s.id);
   const n=list.filter(e=>completed[e.id]).length;
   const stars=document.getElementById("stars-"+s.id);
   if(stars)stars.innerHTML=Array.from({length:5},(_,i)=>`<span class="${i<Math.round(n/list.length*5)?"":"star-off"}">★</span>`).join(" ");
   list.forEach(e=>{
     const sub=document.getElementById("sub-"+e.id);
     if(sub)sub.textContent=completed[e.id]?"✓ مكتمل":"ابدأ";
     const tile=document.querySelector(`[data-open-exercise="${e.id}"]`);
     if(tile)tile.classList.toggle("done",!!completed[e.id]);
   });
 });
}
function resetAll(){
 if(!confirm("بغيتي تمسح جميع النتائج وترجع الاختبار من الأول؟"))return;
 vocabMatchState.left=null;vocabMatchState.done.clear();
 Object.keys(completed).forEach(k=>delete completed[k]);
 Object.keys(scoreMap).forEach(k=>delete scoreMap[k]);
 exercises.forEach(e=>renderExercise(e));
 updateDashboard();showStage("stage1");
}
document.addEventListener("click",ev=>{
 const vocabMatch=ev.target.closest("[data-vocab-match]");
 if(vocabMatch){handleVocabMatch(vocabMatch);return;}
 const reset=ev.target.closest("[data-reset-exercise]");
 if(reset){resetExercise(reset.dataset.resetExercise);return;}
 const stage=ev.target.closest("[data-show-stage]");
 if(stage){showStage(stage.dataset.showStage);return;}
 const lesson=ev.target.closest("[data-open-exercise]");
 if(lesson){openExercise(lesson.dataset.openExercise);return;}
 const back=ev.target.closest("[data-back-to-stage]");
 if(back){const e=exercises.find(x=>x.id===currentExercise);showStage(e?e.stage:"stage1");return;}
 const answerChoice=ev.target.closest("[data-choice-value]");
 if(answerChoice){
   const item=answerChoice.closest("[data-question]");
   if(item){
     const hidden=item.querySelector("[data-answer-hidden]");
     if(hidden)hidden.value=answerChoice.dataset.choiceValue;
     item.querySelectorAll(".choice").forEach(btn=>btn.classList.toggle("selected",btn===answerChoice));
     item.classList.remove("correct","incorrect");
   }
   return;
 }
 const check=ev.target.closest("[data-check]");
 if(check){checkExercise(check.dataset.check);return;}
 const reveal=ev.target.closest("[data-reveal]");
 if(reveal){revealExercise(reveal.dataset.reveal);return;}
 const next=ev.target.closest("[data-next]");
 if(next){
   const i=exercises.findIndex(x=>x.id===next.dataset.next);
   if(i>=0&&i<exercises.length-1)openExercise(exercises[i+1].id);
   else showStage("stage5");
   return;
 }
});
document.addEventListener("change",ev=>{
 const item=ev.target.closest("[data-question]");
 if(item){item.classList.remove("correct","incorrect");}
 if(ev.target.matches('#u3 input[type="radio"]')){
   const total=exercises.find(e=>e.id==="u3").questions.length;
   const answered=document.querySelectorAll('#u3 input[type="radio"]:checked').length;
   const text=document.getElementById("u3AnsweredText");
   const fill=document.getElementById("u3AnsweredFill");
   const track=document.querySelector("#u3 .quiz-progress-track");
   if(text)text.textContent=`${answered} / ${total} beantwortet`;
   if(fill)fill.style.width=(answered/total*100)+"%";
   if(track)track.setAttribute("aria-valuenow",String(answered));
 }
});
renderAll();
updateDashboard();

</script>
</body>
</html>
