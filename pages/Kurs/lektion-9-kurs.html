function el(tag,className,text){const n=document.createElement(tag);if(className)n.className=className;if(text!==undefined)n.textContent=text;return n}
function makeCard(item,section,index){
 const type=section.id;
 const cls=type==='home'?(index<4?'room':'home-word'):type==='verbs'?'verb':type==='sentences'?'sentence':'';
 const btn=el('button','item '+cls);btn.type='button';btn.setAttribute('aria-label',item.de+' — '+item.ar);
 btn.title=item.de+' — '+item.ar;
 const img=el('img');img.src=item.image;img.alt='';img.draggable=false;img.loading='eager';btn.appendChild(img);
 const de=el('span','de-label',item.de);de.lang='de';const ar=el('span','ar-label',item.ar);ar.lang='ar';
 if((type==='home'&&index>=4)||type==='sentences'){
  const stack=el('span','label-stack');stack.append(de,ar);btn.append(stack);
 }else{btn.append(de,ar)}
 btn.addEventListener('click',()=>openItem(item));return btn;
}
function renderSlides(){
 SECTIONS.forEach((section,i)=>{
  const slide=el('section','slide');slide.id='slide-'+i;slide.setAttribute('role','group');slide.setAttribute('aria-roledescription','slide');slide.setAttribute('aria-label',section.title+' — '+section.ar);
  const root=el('div','cards '+section.layout);
  if(section.id==='home'){
   const rooms=el('div','rooms'),words=el('div','home-words');
   section.items.forEach((it,j)=>(j<4?rooms:words).appendChild(makeCard(it,section,j)));
   root.append(rooms,words);
  }else{section.items.forEach((it,j)=>root.appendChild(makeCard(it,section,j)))}
  slide.appendChild(root);viewport.appendChild(slide);
  const dot=el('button','dot');dot.type='button';dot.setAttribute('aria-label','اذهب إلى '+section.ar);dot.addEventListener('click',()=>{if(!quizMode)goTo(i)});dots.appendChild(dot);
  const tab=el('button','tab',section.ar);tab.type='button';tab.id='tab-'+i;tab.setAttribute('role','tab');tab.appendChild(el('span','',section.title));tab.addEventListener('click',()=>{if(!quizMode)goTo(i)});tabs.appendChild(tab);
 });
}
const QUIZ_TOTAL=10;
const QUIZ_TYPES=['meaning','letters','sentence','listen','write','meaning','letters','sentence','listen','write'];
const QUIZ_LABELS={meaning:'🧩 المعاني والترجمة',letters:'🔤 الحروف مبعثرة',sentence:'📝 رتب الجملة',listen:'🎧 استمع وجاوب',write:'⌨️ اكتب بالألمانية'};
// Very short model sentences use the vocabulary taught in each respective stage.
const SENTENCE_EXAMPLES={"sachen":[{"de":"Ich suche die Kamera.","ar":"أنا أبحث عن الكاميرا."},{"de":"Ich kaufe die Schuhe.","ar":"أنا أشتري الأحذية."}],"important":[{"de":"Der Verkäufer hat ein Buch.","ar":"البائع لديه كتاب."},{"de":"Der Kaffee kostet Geld.","ar":"القهوة تكلف مالاً."}],"adjectives":[{"de":"Die Tasche ist schön.","ar":"الحقيبة جميلة."},{"de":"Das Buch ist alt.","ar":"الكتاب قديم."}],"verbs":[{"de":"Ich kaufe ein Buch.","ar":"أنا أشتري كتاباً."},{"de":"Ich suche eine Tasche.","ar":"أنا أبحث عن حقيبة."}],"sentences":[{"de":"Ich suche ein Buch.","ar":"أنا أبحث عن كتاب."},{"de":"Wie viel kostet das?","ar":"كم ثمن هذا؟"}],"expressions":[{"de":"Das ist super.","ar":"هذا رائع."},{"de":"Die Sachen sind gut.","ar":"الأشياء جيدة."}]};
const quizPanel=document.getElementById('quizPanel');
const progress=SECTIONS.map(()=>({done:false,score:0}));
let quizMode=false,quizIndex=0,quizAnswered=false,quizScore=0,quizQuestions=[];
const quizElement=(tag,cls,value)=>el(tag,cls,value);
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function shuffledOutOfOrder(values){let mixed=shuffle(values);for(let tries=0;tries<10&&mixed.every((v,i)=>v.id===values[i].id);tries++)mixed=shuffle(values);if(mixed.every((v,i)=>v.id===values[i].id)&&values.length>1)mixed=[...values.slice(1),values[0]];return mixed}
function normalizeAnswer(value){return String(value).normalize('NFC').toLowerCase().trim().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss').replace(/[.!?,،؟؛:]/g,'').replace(/\s+/g,' ')}
function quizChoices(item,other,field){return shuffle([item[field],...shuffle(other.filter(x=>x[field]!==item[field])).slice(0,3).map(x=>x[field])])}
function spellingItems(section){
 if(section.id==='sentences')return [{word:'kaufe',ar:'أشتري'},{word:'suche',ar:'أبحث'},{word:'finde',ar:'أجد'},{word:'kostet',ar:'يكلّف'},{word:'möchte',ar:'أريد'}];
 if(section.id==='expressions')return [{word:'super',ar:'ممتاز'},{word:'schlecht',ar:'سيئ'},{word:'handeln',ar:'يساوم'},{word:'Second',ar:'مستعمل'}];
 return section.items.map(it=>({word:section.id==='verbs'?(it.speak||it.de):it.de.replace(/^(?:der|die|das)\s+/i,''),ar:it.ar})).filter(it=>/^[\p{L}]+$/u.test(it.word)&&[...it.word].length>=4&&[...it.word].length<=14);
}
function writingItems(section){
 if(section.id==='sentences')return [{de:'Wie viel kostet das?',ar:'كم ثمن هذا؟'},{de:'Ich kaufe ein Buch.',ar:'أنا أشتري كتاباً.'}];
 if(section.id==='expressions')return [{de:'gut',ar:'جيد'},{de:'schlecht',ar:'سيئ'}];
 return section.items.map(it=>({...it,de:section.id==='verbs'?(it.speak||it.de):it.de}));
}
function makeQuestions(section){
 const items=section.items,meanA=items[0],meanB=items[Math.floor(items.length/2)];
 const pool=shuffle(spellingItems(section));
 const written=shuffle(writingItems(section));
 const audible=shuffle(items);
 const examples=SENTENCE_EXAMPLES[section.id];
 const meanings=[meanA,meanB];
 const spelling=[pool[0],pool[1]||pool[0]];
 const sentences=shuffle(examples);
 const listening=[audible[0],audible[1]];
 const writing=[written[0],written[1]];
 const questions=[];
 for(let i=0;i<10;i++){
  const kind=QUIZ_TYPES[i],position=Math.floor(i/5),item={meaning:meanings,letters:spelling,sentence:sentences,listen:listening,write:writing}[kind][position];
  if(kind==='meaning')questions.push({kind,prompt:'شنو المعنى الصحيح لهاد الكلمة بالألمانية؟',target:item.de,answer:item.ar,options:quizChoices(item,items.filter(x=>x!==item),'ar')});
  if(kind==='letters')questions.push({kind,prompt:'الحروف مبعثرة! رتبهم باش تكتب الكلمة الألمانية.',target:item.ar,answer:item.word,letters:true});
  if(kind==='sentence')questions.push({kind,prompt:'رتب الكلمات باش تركّب الجملة الألمانية الصحيحة.',target:item.ar,answer:item.de,words:true});
  if(kind==='listen')questions.push({kind,prompt:'سمع الكلمة بالألمانية، ومن بعد اختار المعنى الصحيح.',answer:item.ar,speak:item.speak||item.de,options:quizChoices(item,items.filter(x=>x!==item),'ar')});
  if(kind==='write')questions.push({kind,prompt:'شوف المعنى بالعربية، واكتب المقابل ديالو بالألمانية.',target:item.ar,answer:item.de,writing:true});
 }
 return questions;
}
function startQuiz(){
 if(quizMode)return;
 quizMode=true;document.querySelector('.controls').classList.add('quiz-active');quizIndex=0;quizScore=0;quizAnswered=false;quizQuestions=makeQuestions(SECTIONS[current]);
 viewport.hidden=true;quizPanel.hidden=false;
 document.getElementById('sectionHeading').querySelector('.section-ar').textContent='— تمارين: '+SECTIONS[current].ar;
 document.getElementById('prev').textContent='❮ السابق';document.getElementById('next').hidden=true;
 renderQuestion();quizPanel.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function renderQuestion(){
 const q=quizQuestions[quizIndex];quizAnswered=false;quizPanel.replaceChildren();
 const head=quizElement('div','quiz-head');head.append(quizElement('span','quiz-kind',QUIZ_LABELS[q.kind]),quizElement('span','quiz-counter',(quizIndex+1)+' / '+QUIZ_TOTAL));quizPanel.append(head);
 const track=quizElement('div','quiz-track');const bar=quizElement('div','');bar.style.width=quizIndex/QUIZ_TOTAL*100+'%';track.append(bar);quizPanel.append(track);
 quizPanel.append(quizElement('div','quiz-instruction',q.prompt));
 if(q.target){const target=quizElement('div','quiz-target'+(q.kind!=='meaning'?' ar-prompt':''),q.target);target.lang=q.kind==='meaning'?'de':'ar';quizPanel.append(target)}
 const feedback=quizElement('div','quiz-feedback');feedback.hidden=true;
 const bottom=quizElement('div','quiz-foot quiz-foot--question'),score=quizElement('span','quiz-stage-note','النقاط: '+quizScore+' / '+quizIndex);
 const next=quizElement('button','quiz-go',quizIndex===QUIZ_TOTAL-1?'شوف النتيجة ❯':'السؤال الموالي ❯');next.type='button';next.disabled=true;
 next.onclick=()=>{if(!quizAnswered)return;if(quizIndex===QUIZ_TOTAL-1)finishQuiz();else{quizIndex++;renderQuestion()}};
 const interactive=[];
 function showResult(ok){
  if(quizAnswered)return;quizAnswered=true;if(ok)quizScore++;
  interactive.forEach(el=>el.disabled=true);
  feedback.hidden=false;feedback.className='quiz-feedback '+(ok?'ok':'no');
  feedback.append(quizElement('span','',ok?'✅ برافو! الجواب صحيح.':'❌ الجواب ماشي صحيح.'));
  const answer=quizElement('span','correct-answer',q.answer);answer.lang=q.kind==='meaning'||q.kind==='listen'?'ar':'de';if(q.kind==='meaning'||q.kind==='listen')answer.style.direction='rtl';feedback.append(answer);
  score.textContent='النقاط: '+quizScore+' / '+(quizIndex+1);next.disabled=false;
 }
 if(q.kind==='meaning'||q.kind==='listen'){
  if(q.kind==='listen'){
   const audio=quizElement('div','quiz-audio');const play=quizElement('button','quiz-sound','🔊 اضغط باش تسمع الكلمة');play.type='button';play.onclick=()=>speak(q.speak,'de-DE');audio.append(play);quizPanel.append(audio);
   quizPanel.append(quizElement('div','quiz-hint','تقدر تسمع الكلمة أكثر من مرة قبل الجواب.'));
  }
  const options=quizElement('div','quiz-options');
  q.options.forEach(value=>{
   const btn=quizElement('button','quiz-option',value);btn.type='button';btn.lang='ar';interactive.push(btn);
   btn.onclick=()=>{if(quizAnswered)return;showResult(value===q.answer);[...options.children].forEach(b=>{if(b.textContent===q.answer)b.classList.add('correct');else if(b===btn)b.classList.add('wrong')})};
   options.append(btn);
  });quizPanel.append(options);
 }else if(q.kind==='letters'||q.kind==='sentence'){
  const symbols=q.kind==='letters'?Array.from(q.answer):q.answer.replace(/[.!?]+$/,'').trim().split(/\s+/);
  const tiles=shuffledOutOfOrder(symbols.map((val,id)=>({val,id})));let selected=[];
  const answerBox=quizElement('div','quiz-constructed');answerBox.setAttribute('aria-label','الكلمة أو الجملة اللي كتكوّن');
  const options=quizElement('div','quiz-tiles');
  function redraw(){
   answerBox.replaceChildren();
   if(!selected.length)answerBox.append(quizElement('span','quiz-placeholder','اضغط على الحروف أو الكلمات بالترتيب الصحيح'));
   selected.forEach(tile=>{const chip=quizElement('button','quiz-tile quiz-picked',tile.val);chip.type='button';chip.title='اضغط باش تحيد هاد العنصر';chip.disabled=quizAnswered;chip.onclick=()=>{selected=selected.filter(t=>t.id!==tile.id);redraw()};answerBox.append(chip)});
   options.replaceChildren();tiles.forEach(tile=>{const btn=quizElement('button','quiz-tile',tile.val);btn.type='button';btn.disabled=quizAnswered||selected.some(t=>t.id===tile.id);btn.onclick=()=>{selected.push(tile);redraw()};options.append(btn)});
   check.disabled=quizAnswered||selected.length!==symbols.length;
  }
  const actions=quizElement('div','quiz-actions');const reset=quizElement('button','quiz-reset','↶ مسح الترتيب');reset.type='button';reset.onclick=()=>{selected=[];redraw()};
  const check=quizElement('button','quiz-check','✔ تحقق من الجواب');check.type='button';check.onclick=()=>{if(selected.length!==symbols.length||quizAnswered)return;const value=q.kind==='letters'?selected.map(t=>t.val).join(''):selected.map(t=>t.val).join(' ');showResult(normalizeAnswer(value)===normalizeAnswer(q.answer));redraw();reset.disabled=true};
  interactive.push(reset,check);
  quizPanel.append(answerBox,options);actions.append(reset,check);quizPanel.append(actions);redraw();
 }else if(q.kind==='write'){
  quizPanel.append(quizElement('div','quiz-hint','اكتب بالألمانية. الأحرف الكبيرة والصغيرة مقبولة، وحتى ae بدل ä و ss بدل ß.'));
  const input=quizElement('input','quiz-input');input.type='text';input.lang='de';input.dir='ltr';input.autocomplete='off';input.autocapitalize='off';input.spellcheck=false;input.placeholder='Schreib auf Deutsch ...';input.setAttribute('aria-label','كتب الجواب بالألمانية');
  const actions=quizElement('div','quiz-actions'),check=quizElement('button','quiz-check','✔ تحقق من الكتابة');check.type='button';check.disabled=true;
  input.addEventListener('input',()=>{check.disabled=quizAnswered||!input.value.trim()});
  input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!check.disabled){e.preventDefault();check.click()}});
  check.onclick=()=>showResult(normalizeAnswer(input.value)===normalizeAnswer(q.answer));
  interactive.push(input,check);actions.append(check);quizPanel.append(input,actions);
 }
 quizPanel.append(feedback);bottom.append(next,score);quizPanel.append(bottom);
}
function finishQuiz(){
 progress[current]={done:true,score:quizScore};quizPanel.replaceChildren();
 const result=quizElement('div','quiz-result');result.append(quizElement('div','quiz-kind','🏁 نتيجة المرحلة'));
 result.append(quizElement('h3','','كملتي 10 تمارين ديال هاد المرحلة!'));
 result.append(quizElement('strong','',quizScore+' / '+QUIZ_TOTAL));
 result.append(quizElement('p','','النتيجة: '+Math.round(quizScore/QUIZ_TOTAL*100)+'% — تقدر تعاود التمارين باش تحسّن النتيجة.'));
 const actions=quizElement('div','quiz-foot');actions.style.justifyContent='center';
 const retry=quizElement('button','quiz-secondary','↻ عاود 10 تمارين');retry.onclick=()=>{quizMode=false;startQuiz()};
 if(current<SECTIONS.length-1){
  const continueBtn=quizElement('button','quiz-go','المرحلة الموالية ❯');
  continueBtn.onclick=()=>{quizMode=false;quizPanel.hidden=true;viewport.hidden=false;goTo(current+1)};
  actions.append(retry,continueBtn);
 }else{
  result.append(quizElement('p','quiz-finish-note','🎉 كملتي جميع المراحل!'));
  actions.append(retry);
 }
 result.append(actions);quizPanel.append(result);
 document.getElementById('next').hidden=true;updateTabs();
}
function updateTabs(){
 [...tabs.children].forEach((t,i)=>{t.firstChild.textContent=SECTIONS[i].ar+(progress[i].done?' ✓':'');t.title=i>0&&progress.slice(0,i).some(p=>!p.done)?'كمل تمارين المراحل السابقة أولاً':''});
}
function goTo(index){
 if(index<0||index>=SECTIONS.length)return;
 if(index>0&&progress.slice(0,index).some(p=>!p.done))return;
 if(quizMode)return;
 current=index;document.querySelector('.controls').classList.remove('quiz-active');document.getElementById('next').hidden=false;document.getElementById('prev').textContent='❮ السابق';
 const s=SECTIONS[index];document.documentElement.style.setProperty('--accent',s.color);
 const h=document.getElementById('sectionHeading');h.querySelector('.section-de').textContent=s.title;h.querySelector('.section-ar').textContent='— '+s.ar;
 document.getElementById('slideCount').textContent=(index+1)+' / '+SECTIONS.length;
 [...viewport.children].forEach((slide,j)=>{const shown=j===index;slide.classList.toggle('active',shown);slide.setAttribute('aria-hidden',String(!shown));slide.querySelectorAll('button').forEach(b=>b.tabIndex=shown?0:-1)});
 [...dots.children].forEach((b,j)=>{if(j===index)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});
 [...tabs.children].forEach((b,j)=>{b.setAttribute('aria-selected',String(j===index));b.tabIndex=j===index?0:-1});
 document.getElementById('prev').disabled=index===0;document.getElementById('next').disabled=false;
 document.getElementById('next').textContent=progress[index].done?(index===SECTIONS.length-1?'راجع التمارين ❯':'المرحلة الموالية ❯'):'ابدأ 10 تمارين ❯';
 updateTabs();
}
function forward(){
 if(quizMode)return;
 if(!progress[current].done||current===SECTIONS.length-1){startQuiz();return}
 goTo(current+1);
}
function backward(){if(quizMode)return;goTo(current-1)}

function speak(value,lang){
 if(!('speechSynthesis' in window))return;
 window.speechSynthesis.cancel();const utterance=new SpeechSynthesisUtterance(value);utterance.lang=lang;
 const voices=window.speechSynthesis.getVoices();const selected=voices.find(v=>v.lang.toLowerCase().startsWith(lang.substring(0,2).toLowerCase()));
 if(selected)utterance.voice=selected;utterance.rate=.9;window.speechSynthesis.speak(utterance);
}
function openItem(item){
 active=item;previousFocus=document.activeElement;deText.textContent=item.de;arText.textContent=item.ar;
 overlay.classList.add('open');overlay.setAttribute('aria-hidden','false');document.getElementById('closeBtn').focus();
 setTimeout(()=>{if(overlay.classList.contains('open')&&active===item)speak(item.speak||item.de,'de-DE')},80);
}
function closeModal(){
 if(!overlay.classList.contains('open'))return;
 overlay.classList.remove('open');overlay.setAttribute('aria-hidden','true');if('speechSynthesis' in window)window.speechSynthesis.cancel();
 if(previousFocus&&previousFocus.isConnected)previousFocus.focus();
}
document.getElementById('prev').addEventListener('click',backward);document.getElementById('next').addEventListener('click',forward);
document.getElementById('closeBtn').addEventListener('click',closeModal);
window.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();return}if(overlay.classList.contains('open'))return;if(quizMode)return;if(e.key==='ArrowLeft'){e.preventDefault();backward()}if(e.key==='ArrowRight'){e.preventDefault();forward()}});
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal()});
document.getElementById('playDe').addEventListener('click',()=>active&&speak(active.speak||active.de,'de-DE'));
document.getElementById('playAr').addEventListener('click',()=>active&&speak(active.ar,'ar-MA'));
let swipe=null;viewport.addEventListener('touchstart',e=>{if(e.touches.length===1)swipe={x:e.touches[0].clientX,y:e.touches[0].clientY}},{passive:true});
viewport.addEventListener('touchend',e=>{if(!swipe||e.changedTouches.length!==1)return;const x=e.changedTouches[0].clientX-swipe.x,y=e.changedTouches[0].clientY-swipe.y;if(Math.abs(x)>55&&Math.abs(x)>Math.abs(y)*1.3)(x<0?forward():backward());swipe=null},{passive:true});
renderSlides();goTo(0);
</script>
</body></html>
