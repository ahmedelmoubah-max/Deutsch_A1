<head>

<title>Familie und Freunde — تعلم بالنطق</title>
<style>
:root { color-scheme: light; --ink:#12245d; }
* { box-sizing:border-box; }
body { margin:0; padding:18px 12px 30px; background:linear-gradient(135deg,#eaf8ff,#fff7e7 55%,#f5edff); color:var(--ink); font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
main { max-width:1050px; margin:0 auto; }
h1 { margin:0 0 5px; text-align:center; font-size:clamp(22px,4vw,34px); color:#103c9a; }
.intro { text-align:center; margin:0 0 14px; font-size:15px; }
.poster-wrap { position:relative; width:min(100%,934px); margin:0 auto; line-height:0; border-radius:18px; overflow:hidden; box-shadow:0 8px 28px #17345c26; background:white; }
.poster-wrap img { display:block; width:100%; height:auto; }
.poster-wrap svg { position:absolute; inset:0; width:100%; height:100%; }
.hotspot { fill:rgba(255,255,255,0.001); stroke:transparent; stroke-width:2.8; cursor:pointer; pointer-events:all; transition:fill .12s ease, stroke .12s ease; }
.hotspot:hover,.hotspot:focus { fill:rgba(255,220,70,.22); stroke:#087fe0; outline:none; }
.controls { width:min(100%,934px); margin:12px auto 0; padding:14px; border-radius:16px; background:#ffffffed; box-shadow:0 4px 18px #17345c18; display:grid; grid-template-columns:1fr auto auto; gap:10px; align-items:center; }
.now { min-width:0; }
.now small { display:block; color:#527096; font-size:12px; }
#selected { font-weight:800; font-size:19px; overflow-wrap:anywhere; }
#translation { color:#174b9a; font-size:16px; }
button { border:0; border-radius:12px; padding:10px 14px; font:700 14px system-ui,sans-serif; background:#087fe0; color:white; cursor:pointer; min-height:42px; }
button.secondary { background:#e9f2ff; color:#174b9a; }
button:focus-visible { outline:3px solid #ffbf24; outline-offset:2px; }
#status { width:min(100%,934px); margin:9px auto 0; text-align:center; color:#536782; font-size:12px; }
@media(max-width:600px) { body { padding:10px 6px 20px; } .controls { grid-template-columns:1fr 1fr; padding:10px; gap:8px; } .now { grid-column:1/-1; } button { padding:9px 8px; } }
</style>

let slow = false;
let selectedIndex = -1;
function pickGermanVoice() {
  if (!('speechSynthesis' in window)) return null;
  const voices = speechSynthesis.getVoices();
  return voices.find(v => /^de(-|_)/i.test(v.lang)) || voices.find(v => /german|deutsch/i.test(v.name)) || null;
}
function playItem(i) {
  const item = items[i];
  if (!item) return;
  selectedIndex = i;
  document.getElementById('selected').textContent = item.de;
  document.getElementById('translation').textContent = item.ar;
  if (!('speechSynthesis' in window)) {
    document.getElementById('status').textContent = 'المتصفح ديالك ما كيدعمش النطق الصوتي. جربي Chrome أو Safari.';
    return;
  }
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(item.de);
  utterance.lang = 'de-DE';
  utterance.rate = slow ? 0.72 : 0.92;
  utterance.pitch = 1;
  const voice = pickGermanVoice();
  if (voice) utterance.voice = voice;
  utterance.onstart = () => document.getElementById('status').textContent = 'كننطق دابا بالألمانية: ' + item.de;
  utterance.onend = () => document.getElementById('status').textContent = 'سالينا — كليكي على كلمة أخرى أو عاودي نفس البطاقة.';
  utterance.onerror = () => document.getElementById('status').textContent = 'ما قدرش المتصفح يشغل الصوت. تأكدي من إعدادات الصوت أو جربي متصفح آخر.';
  speechSynthesis.speak(utterance);
}
function toggleSlow() {
  slow = !slow;
  document.getElementById('slowBtn').textContent = slow ? '🐢 النطق البطيء: نعم' : '🐢 النطق البطيء: لا';
  if (selectedIndex >= 0) playItem(selectedIndex);
}
function stopSpeech() {
  if ('speechSynthesis' in window) speechSynthesis.cancel();
  document.getElementById('status').textContent = 'توقف الصوت.';
}
document.querySelectorAll('.hotspot').forEach(el => {
  el.addEventListener('click', () => playItem(Number(el.dataset.i)));
  el.addEventListener('keydown', ev => {
    if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); playItem(Number(el.dataset.i)); }
  });
});
if ('speechSynthesis' in window) speechSynthesis.getVoices();
