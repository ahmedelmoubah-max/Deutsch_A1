<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f7f8fc">
<title>Deutsch – منصة تعلّم الألمانية</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="podcastWordOverlay" class="podcast-word-overlay" aria-hidden="true">
  <div class="podcast-word-modal" role="dialog" aria-modal="true" aria-labelledby="podcastWordModalTitle">
    <div class="podcast-word-modal-head">
      <span id="podcastWordModalTitle" class="podcast-word-modal-title">معنى الكلمة</span>
      <button type="button" id="podcastWordClose" class="podcast-word-modal-close" aria-label="إغلاق">×</button>
    </div>
    <div id="podcastWordGerman" class="podcast-word-german" dir="ltr"></div>
    <div id="podcastWordMeaning" class="podcast-word-meaning" dir="rtl"></div>
  </div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-functions-compat.js"></script>
<script src="js/app.js" defer></script>
</body>
</html>
